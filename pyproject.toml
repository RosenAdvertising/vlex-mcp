[project]
name = "vlex-mcp"
version = "0.1.0"
description = "An MCP server for verified vLex legal research and Vincent AI endpoints"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx==0.28.1",
    "mcp>=2.3,<3",
]

[project.scripts]
vlex-mcp-setup = "vlex_mcp.setup:setup"
vlex-mcp-verify = "vlex_mcp.setup:verify"
vlex-mcp = "vlex_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx==0.22.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
