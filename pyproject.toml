[project]
name = "vlex-mcp"
version = "0.1.0"
description = "MCP server for vLex: legal research and Vincent AI workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx==0.28.1",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/RosenAdvertising/vlex-mcp"
Repository = "https://github.com/RosenAdvertising/vlex-mcp"
Issues = "https://github.com/RosenAdvertising/vlex-mcp/issues"

[project.scripts]
vlex-mcp-setup = "vlex_mcp.setup:setup"
vlex-mcp-verify = "vlex_mcp.setup:verify"
vlex-mcp = "vlex_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx==0.23.1",
    "ruff==0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
